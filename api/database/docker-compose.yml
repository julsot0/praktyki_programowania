version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: secret
  
  producer:
    build: .
    ports:
      - "8000:8000"
    environment:
      RABBITMQ_HOST: rabbitmq
    depends_on:
      - rabbitmq
    command: uvicorn producer:app --host 0.0.0.0 --port 8000
  
  consumer1:
    build: .
    environment:
      RABBITMQ_HOST: rabbitmq
    depends_on:
      - rabbitmq
    command: python consumer.py 1
  
  consumer2:
    build: .
    environment:
      RABBITMQ_HOST: rabbitmq
    depends_on:
      - rabbitmq
    command: python consumer.py 2